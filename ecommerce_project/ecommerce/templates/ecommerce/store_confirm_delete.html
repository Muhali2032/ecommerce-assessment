
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Store - eCommerce</title>
</head>
<body>

    <h1>Delete Store</h1>

    <p>Are you sure you want to delete "{{ store.name }}"?</p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">Yes, Delete Store</button>
    </form>

    <a href="{% url 'store_list' %}">Cancel</a>

</body>
</html>
