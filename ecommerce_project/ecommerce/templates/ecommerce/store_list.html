
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Stores - eCommerce</title>
</head>
<body>

    <h1>My Stores</h1>

    <a href="{% url 'store_create' %}">Create New Store</a>

    <hr>

    {% if stores %}
        {% for store in stores %}
            <h2>{{ store.name }}</h2>

            <p>{{ store.description }}</p>
            <a href="{% url 'product_list' store.pk %}">Manage Products</a>

            <a href="{% url 'store_update' store.pk %}">Edit Store</a>

            <a href="{% url 'store_delete' store.pk %}">Delete Store</a>

            <hr>
        {% endfor %}
    {% else %}
        <p>You have not created any stores yet.</p>
    {% endif %}

    <a href="{% url 'dashboard' %}">Back to Dashboard</a>

</body>
</html>
